<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Auto Messages - YorLuv Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #8e82ff 0%, #ff6b9d 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            max-width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #8e82ff;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5em;
        }
        .info-box {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .info-box strong {
            display: block;
            margin-bottom: 8px;
            color: #004085;
        }
        .status-item {
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 0.9em;
        }
        .status-item.success {
            background: #d4edda;
            color: #155724;
        }
        .status-item.warning {
            background: #fff3cd;
            color: #856404;
        }
        .status-item.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status-item.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #8e82ff 0%, #ff6b9d 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug Auto Messages</h1>
        
        <div class="info-box">
            <strong>📝 Hướng dẫn:</strong>
            <p>1. Đảm bảo bạn đã đăng nhập</p>
            <p>2. Đã gửi ít nhất 1 tin nhắn</p>
            <p>3. Nhấn nút "Kiểm tra" bên dưới</p>
        </div>
        
        <button id="checkBtn" onclick="checkStatus()">🔍 Kiểm tra trạng thái</button>
        
        <div id="result"></div>
    </div>
    
    <script>
        async function checkStatus() {
            const btn = document.getElementById('checkBtn');
            const resultDiv = document.getElementById('result');
            
            btn.disabled = true;
            btn.textContent = '⏳ Đang kiểm tra...';
            resultDiv.innerHTML = '<div class="loading">Đang tải...</div>';
            
            try {
                // Lấy thông tin user hiện tại
                const userResponse = await fetch('/api/current_user');
                if (!userResponse.ok) {
                    throw new Error('Chưa đăng nhập');
                }
                const user = await userResponse.json();
                
                if (!user || !user._id) {
                    throw new Error('Không tìm thấy thông tin user');
                }
                
                // Lấy character từ localStorage
                const character = localStorage.getItem('currentCharacter') || 'mera';
                
                // Gọi debug endpoint
                const debugResponse = await fetch(`/admin/debug-auto-messages?userId=${user._id}&character=${character}`);
                if (!debugResponse.ok) {
                    throw new Error('Không thể lấy thông tin debug');
                }
                
                const data = await debugResponse.json();
                
                // Hiển thị kết quả
                let html = '<div style="margin-top: 20px;">';
                
                // Thông tin cơ bản
                html += `<div class="status-item info">
                    <strong>📊 Thông tin cơ bản:</strong><br>
                    User ID: <code>${data.userId}</code><br>
                    Character: <strong>${data.character}</strong><br>
                    Relationship: <strong>${data.relationship_stage}</strong><br>
                    Message Count: <strong>${data.message_count}</strong>
                </div>`;
                
                // Last message
                if (data.last_user_message) {
                    html += `<div class="status-item ${data.minutes_since_last_message >= 3 ? 'success' : 'warning'}">
                        <strong>💬 Tin nhắn cuối:</strong><br>
                        "${data.last_user_message.substring(0, 50)}${data.last_user_message.length > 50 ? '...' : ''}"<br>
                        Thời gian: <code>${data.last_message_time ? new Date(data.last_message_time).toLocaleString('vi-VN') : 'N/A'}</code><br>
                        Đã qua: <strong>${data.minutes_since_last_message ? data.minutes_since_last_message.toFixed(2) : 'N/A'} phút</strong>
                    </div>`;
                } else {
                    html += `<div class="status-item error">
                        <strong>❌ Chưa có tin nhắn:</strong><br>
                        Bạn cần gửi ít nhất 1 tin nhắn để có thể nhận auto messages
                    </div>`;
                }
                
                // Auto messages status
                html += `<div class="status-item ${data.can_send_followup ? 'success' : 'warning'}">
                    <strong>📤 Trạng thái Auto Messages:</strong><br>
                    Đã gửi hôm nay: <strong>${data.auto_messages_sent_today}/3</strong><br>
                    Có thể gửi follow-up: <strong>${data.can_send_followup ? '✅ CÓ' : '❌ KHÔNG'}</strong>
                </div>`;
                
                // Điều kiện
                html += `<div class="status-item info">
                    <strong>✅ Điều kiện:</strong><br>
                    ${data.message_count > 0 ? '✅' : '❌'} Message count > 0: ${data.message_count}<br>
                    ${data.minutes_since_last_message >= 3 ? '✅' : '⏳'} Đã qua >= 3 phút: ${data.minutes_since_last_message ? data.minutes_since_last_message.toFixed(2) : 'N/A'} phút<br>
                    ${data.auto_messages_sent_today < 3 ? '✅' : '❌'} Chưa đạt giới hạn: ${data.auto_messages_sent_today}/3<br>
                    ${new Date().getHours() >= 4 && new Date().getHours() < 23 ? '✅' : '❌'} Khung giờ hoạt động: ${new Date().getHours()}h
                </div>`;
                
                // Greeting status
                html += `<div class="status-item info">
                    <strong>🌅 Greeting Status:</strong><br>
                    Last greeting: <code>${data.last_greeting_sent || 'Chưa có'}</code><br>
                    Last greeting date: <code>${data.last_greeting_date || 'N/A'}</code>
                </div>`;
                
                html += '</div>';
                resultDiv.innerHTML = html;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="status-item error">
                    <strong>❌ Lỗi:</strong><br>
                    ${error.message}
                </div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 Kiểm tra trạng thái';
            }
        }
        
        // Auto check khi load trang
        window.onload = () => {
            checkStatus();
        };
    </script>
</body>
</html>
